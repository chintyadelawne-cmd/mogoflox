<script>
// Ambil parameter ?id=
const urlParams = new URLSearchParams(window.location.search);
const videoId = urlParams.get('id');

// Kalau tidak ada id
if (!videoId) {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;'>Video not found</h2>";
} else {

    // Link tujuan utama
    const finalLink = "https://mogoplay.xyz/v/" + videoId;

    function redirectVideo() {
        document.getElementById("spinner").style.display = "flex";
        setTimeout(function(){
            window.location.href = finalLink;
        }, 1200);
    }

    // Biar bisa dipanggil onclick
    window.redirectVideo = redirectVideo;
}
</script>
